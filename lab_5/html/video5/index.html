<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML5 Multi-Source Video</title>
</head>

<body>
    <h1>Big Buck Bunny - Multiple Sources</h1>
    <video id="vid" width="640" height="360" controls>
        <source src="big_buck_bunny.mp4" type='video/mp4; codecs="avc1.42E01E, mp4a.40.2"'>
        <source src="big_buck_bunny.webm" type='video/webm; codecs="vp8, vorbis"'>
        <source src="big_buck_bunny.ogv" type='video/ogg; codecs="theora, vorbis"'>
        <p>Your browser does not support HTML5 video.</p>
    </video>

    <script>
        const lastSource = document.querySelector('#vid source:last-of-type');
        lastSource.addEventListener('error', function () {
            document.getElementById('vid').outerHTML =
                '<p>Cannot play video in this browser. <a href="big_buck_bunny.mp4">Download the video</a>.</p>';
        });
    </script>
</body>

</html>
